name: App CI

on:
  push:
    branches:
      - master
      - feature/tray-integration
    paths:
      - '**/*.csproj'
      - '**/*.slnx'
      - '**/*.cs'
      - '**/*.xaml'
      - '**/*.resx'
      - '**/*.ico'
      - '.editorconfig'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '.github/workflows/app-ci.yml'
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.csproj'
      - '**/*.slnx'
      - '**/*.cs'
      - '**/*.xaml'
      - '**/*.resx'
      - '**/*.ico'
      - '.editorconfig'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '.github/workflows/app-ci.yml'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET (x64)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET (x86)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          architecture: x86

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build OnlyR.slnx --configuration Release

      - name: Test
        run: dotnet test --project OnlyR.Tests/OnlyR.Tests.csproj --configuration Release --no-build --report-trx --report-trx-filename test-results.trx --results-directory ./test-results

      - name: Summarize test results
        if: always()
        shell: pwsh
        run: |
          $resultFile = './test-results/test-results.trx'
          if (-not (Test-Path $resultFile)) {
            Write-Error "Test result file not found: $resultFile"
            exit 1
          }

          [xml]$trx = Get-Content $resultFile
          $counters = $trx.TestRun.ResultSummary.Counters
          $total = [int]$counters.total
          $executed = [int]$counters.executed
          $passed = [int]$counters.passed
          $failed = [int]$counters.failed
          $skipped = [int]$counters.notExecuted

          "## Test results" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Total | Executed | Passed | Failed | Skipped |" >> $env:GITHUB_STEP_SUMMARY
          "| ---: | ---: | ---: | ---: | ---: |" >> $env:GITHUB_STEP_SUMMARY
          "| $total | $executed | $passed | $failed | $skipped |" >> $env:GITHUB_STEP_SUMMARY

          Write-Host "Total=$total Executed=$executed Passed=$passed Failed=$failed Skipped=$skipped"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./test-results
          if-no-files-found: error
          retention-days: 14

  format:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore OnlyR.slnx

      - name: Verify formatting
        run: dotnet format OnlyR.slnx --verify-no-changes --no-restore
